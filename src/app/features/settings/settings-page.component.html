<section class="page">
  <p class="eyebrow">Solo en este dispositivo</p>
  <h1>Configuración</h1>
  <div class="segmented" role="tablist" aria-label="Secciones de configuración">
    <button type="button" role="tab" [class.on]="tab() === 'prices'" [attr.aria-selected]="tab() === 'prices'" (click)="tab.set('prices')">
      Precios
    </button>
    <button type="button" role="tab" [class.on]="tab() === 'company'" [attr.aria-selected]="tab() === 'company'" (click)="tab.set('company')">
      Empresa
    </button>
  </div>
  @if (tab() === 'prices') {
    <app-price-settings />
  } @else {
    <app-company-settings />
  }
</section>
